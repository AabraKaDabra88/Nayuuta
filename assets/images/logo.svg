<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" role="img" aria-labelledby="title desc">
  <title id="title">Nayuuta logo</title>
  <desc id="desc">A stylized N mark in a rounded indigo square with a teal accent dot, followed by the Nayuuta wordmark.</desc>
  <!-- Mark -->
  <rect x="10" y="15" width="90" height="90" rx="18" fill="#1F4E79"/>
  <!-- N: left stem, diagonal, right stem -->
  <rect x="28" y="34" width="10" height="52" fill="#FFFFFF"/>
  <polygon points="28,34 40,34 72,74 72,86 60,86 28,46" fill="#FFFFFF"/>
  <rect x="72" y="34" width="10" height="52" fill="#FFFFFF"/>
  <!-- Accent dot -->
  <circle cx="90" cy="26" r="7" fill="#2BB3A3"/>
  <!-- Wordmark -->
  <text x="122" y="79" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="600" letter-spacing="-0.5" fill="#1F4E79">Nayuuta</text>
</svg>
